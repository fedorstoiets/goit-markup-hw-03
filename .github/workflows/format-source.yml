name: Format HW3 with Prettier
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/format-source.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format HTML, CSS and README
        run: npx --yes prettier@3.6.2 --write index.html css/*.css README.md
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css README.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format homework 3 with Prettier"
            git push
          fi
